[project]
name = "de-etl-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jugurtha Kacimi", email = "jugurthakacimi1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
de-etl-pipeline = "de_etl_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgcli>=4.7.1",
    "python-dotenv>=1.2.4",
]
